<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Novia</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            background-image: url('my_background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
            padding: 20px;
        }

        .main-card {
            background: rgba(255, 240, 245, 0.95); 
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            border: 2px solid #ffb6c1;
            width: 100%;
            max-width: 450px;
            position: relative;
            margin: auto;
        }

        h1 { color: #ff1493; font-size: 1.8rem; margin-top: 0; }

        .photo-gallery {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 15px 0;
            width: 100%;
        }

        .photo-gallery img {
            width: 31%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #ff69b4;
        }

        .button-area {
            margin-top: 10px;
            height: 140px; 
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button, .surprise-btn {
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #yes-btn { background: #ff69b4; color: white; transform: translateX(-65px); z-index: 5; }
        
        #no-btn {
            background-color: #ffffff;
            color: #ff1493;
            border: 2px solid #ffb6c1;
            position: absolute;
            left: calc(50% + 5px);
            z-index: 10;
        }

        /* The New "Dey Play" Bubble */
        #dey-play-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 20, 147, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 100;
            pointer-events: none; /* Important: She can click through it! */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            white-space: nowrap;
        }

        .show-toast {
            transform: translate(-50%, -50%) scale(1.2) !important;
            opacity: 1 !important;
        }

        /* Overlays */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(255, 228, 225, 0.95);
        }

        video { width: 100%; max-width: 400px; border-radius: 20px; margin-bottom: 20px; }
        .overlay-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        #whine-btn { background: white; color: #ff1493; border: 1px solid #ff1493; }
        #next-btn { background: #ff69b4; color: white; }

        .letter-container {
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            background: #fffafa;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #ffb6c1;
        }

        #letter-content {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: #333;
            line-height: 1.5;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="main-card" id="proposal-page">
        <h1>Will you be my val, Novia? 🌸</h1>
        
        <div id="dey-play-toast">Dey Play! 😂</div>

        <div class="photo-gallery">
            <img src="photo1.jpg"> 
            <img src="photo2.jpg"> 
            <img src="photo3.jpg">
        </div>
        <div style="font-size: 24px; margin: 10px;">🍰 🎂 🧁</div>
        <div class="button-area" id="box">
            <button id="yes-btn" onclick="showVideo()">Yes!</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="video-overlay" class="overlay">
        <h1 style="color: #ff1493; font-size: 1.5rem;">Wow!! She said Yes!! Again!! ❤️</h1>
        <video id="mainVideo" src="myvideo.mp4" playsinline controls></video>
        <div class="overlay-controls">
            <button class="surprise-btn" id="whine-btn" onclick="goBack()">← You dey whine?</button>
            <button class="surprise-btn" id="next-btn" onclick="showLetter()">Next Surprise! 😊 →</button>
        </div>
    </div>

    <div id="letter-page" class="overlay">
        <div class="letter-container">
            <div id="letter-content"></div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const box = document.getElementById('box');
        const toast = document.getElementById('dey-play-toast');
        let returnTimeout;

        function moveBtn() {
            // Show the hilarious toast
            showToast();

            clearTimeout(returnTimeout);
            const maxX = box.clientWidth - noBtn.offsetWidth - 10;
            const maxY = box.clientHeight - noBtn.offsetHeight - 10;
            
            noBtn.style.left = Math.max(5, Math.random() * maxX) + 'px';
            noBtn.style.top = Math.max(5, Math.random() * maxY) + 'px';
            noBtn.style.transform = "none";
            
            returnTimeout = setTimeout(returnHome, 2000);
        }

        function showToast() {
            toast.classList.add('show-toast');
            setTimeout(() => {
                toast.classList.remove('show-toast');
            }, 800); // Bubble disappears after 0.8s
        }

        function returnHome() {
            noBtn.style.left = "calc(50% + 5px)";
            noBtn.style.top = "50%";
            noBtn.style.transform = "translateY(-50%)";
        }

        noBtn.addEventListener('mouseover', moveBtn);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveBtn(); });

        function showVideo() {
            document.getElementById('video-overlay').style.display = 'flex';
            document.getElementById('mainVideo').play();
        }

        function goBack() {
            document.getElementById('video-overlay').style.display = 'none';
            document.getElementById('mainVideo').pause();
        }

        const letterText = `Dear Novia,

Cheers to our 8th valentines together and the first as my fiance, I chose to be more creative these past few months to show you just how special you are.

Over these 8 years, I have called you different names, Ebube, Querida, Bambina, Tesoro Mio, Vauva and now Novia but through all of these it was all the same. 

The Love I have for you remains the same today as it has always been.

Right now, I just want to show you more and more of how endless my love for you is and to show you that I set the bar and it definitely would keep going higher!

To many more valentines days in Love.

Your Fiance, 
Novio`;

        function showLetter() {
            document.getElementById('video-overlay').style.display = 'none';
            document.getElementById('letter-page').style.display = 'flex';
            typeWriter();
        }

        let i = 0;
        function typeWriter() {
            if (i < letterText.length) {
                let char = letterText.charAt(i);
                document.getElementById("letter-content").innerHTML += char;
                i++;
                let delay = 85; 
                if (char === '.' || char === ',' || char === '!') delay = 450; 
                setTimeout(typeWriter, delay);
            }
        }
    </script>
</body>
</html>
