<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Novia</title>
    <style>
        body {
            background-image: url('my_background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Changed 'justify-content' to allow scrolling */
            justify-content: flex-start; 
            min-height: 100vh;
            margin: 0;
            /* Changed 'overflow' to allow vertical scrolling */
            overflow-x: hidden;
            overflow-y: auto; 
            text-align: center;
            padding: 20px 0; /* Adds space when scrolling */
        }

        .main-card {
            background: rgba(255, 240, 245, 0.9); 
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            border: 3px solid #ffb6c1;
            width: 90%;
            max-width: 500px;
            z-index: 1;
            position: relative;
            /* Ensures card stays centered even when scrollable */
            margin: auto; 
        }

        h1 { color: #ff1493; font-size: 2rem; margin-bottom: 20px; }

        .photo-gallery {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .photo-gallery img {
            width: 30%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ff69b4;
        }

        .button-area {
            margin-top: 20px;
            height: 160px; 
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yes-btn {
            background: #ff69b4;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.3);
            transform: translateX(-75px); 
        }

        #no-btn {
            background-color: #ffffff;
            color: #ff1493;
            border: 2px solid #ff69b4;
            position: absolute;
            z-index: 1000;
            left: calc(50% + 5px); 
            top: 50%;
            transform: translateY(-50%);
        }

        #video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe4e1;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        video { width: 90%; max-height: 70%; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>Will you be my val, Novia? 🌸</h1>
        
        <div class="photo-gallery">
            <img src="photo1.jpg"> 
            <img src="photo2.jpg"> 
            <img src="photo3.jpg">
        </div>

        <div style="font-size: 30px; margin: 10px;">🍰 🎂 🧁</div>

        <div class="button-area" id="box">
            <button id="yes-btn" onclick="showVideo()">Yes!</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="video-overlay">
        <h1 style="color: #ff1493;">I Love You Forever! ❤️</h1>
        <video id="mainVideo" src="myvideo.mp4" playsinline controls></video>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const box = document.getElementById('box');
        let returnTimeout;

        function moveBtn() {
            clearTimeout(returnTimeout);
            
            const padding = 20;
            const maxX = box.clientWidth - noBtn.offsetWidth - padding;
            const maxY = box.clientHeight - noBtn.offsetHeight - padding;
            
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.transform = "none";

            returnTimeout = setTimeout(returnHome, 2000);
        }

        function returnHome() {
            noBtn.style.left = "calc(50% + 5px)";
            noBtn.style.top = "50%";
            noBtn.style.transform = "translateY(-50%)";
        }

        noBtn.addEventListener('mouseover', moveBtn);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveBtn(); });

        function showVideo() {
            document.getElementById('video-overlay').style.display = 'flex';
            document.getElementById('mainVideo').play();
        }
    </script>
</body>
</html>
