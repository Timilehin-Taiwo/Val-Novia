<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Novia</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            background-image: url('my_background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
            padding: 20px;
        }

        .home-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 20000;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px;
            border-radius: 50%;
            line-height: 1;
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        .main-card {
            background: rgba(255, 240, 245, 0.95); 
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            border: 2px solid #ffb6c1;
            width: 100%;
            max-width: 450px;
            position: relative;
            margin: auto;
        }

        h1 { color: #ff1493; font-size: 1.8rem; margin-top: 0; }

        .photo-gallery {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 15px 0;
            width: 100%;
        }

        .photo-gallery img {
            width: 31%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #ff69b4;
        }

        .button-area {
            margin-top: 10px;
            height: 140px; 
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button, .surprise-btn {
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #yes-btn { background: #ff69b4; color: white; transform: translateX(-65px); z-index: 5; }
        #no-btn {
            background-color: #ffffff;
            color: #ff1493;
            border: 2px solid #ffb6c1;
            position: absolute;
            left: calc(50% + 5px);
            z-index: 10;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(255, 228, 225, 0.95);
            overflow-y: auto;
        }

        .letter-container {
            width: 100%;
            max-width: 500px;
            background: #fffafa;
            padding: 50px 25px 30px; 
            border-radius: 20px;
            border: 1px solid #ffb6c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: auto;
        }

        #speed-toggle, #skip-btn {
            position: absolute;
            top: 12px;
            font-size: 0.75rem;
            color: #ff1493;
            background: rgba(255, 182, 193, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid #ffb6c1;
            font-weight: bold;
            z-index: 500;
        }
        #speed-toggle { right: 12px; }
        #skip-btn { left: 12px; display: none; }

        #letter-content {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: #333;
            line-height: 1.5;
            text-align: left;
            white-space: pre-wrap;
            width: 100%;
        }

        #final-love-btn {
            opacity: 0;
            display: none;
            margin-top: 25px;
            background: #ff1493;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
        }

        .fade-in-final {
            display: block !important;
            animation: finalFade 1.2s ease forwards;
        }

        @keyframes finalFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #final-photo-page {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10000;
            background: #ffe4e1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 9 / 16;
            display: flex;
            justify-content: center;
        }

        .final-media {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            border: 6px solid white;
            background: black;
            object-fit: cover;
        }

        .unmute-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 20, 147, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            pointer-events: none;
            display: none;
        }

        .final-text {
            font-family: 'Dancing Script', cursive;
            color: #ff1493;
            font-size: 2.2rem;
            margin-top: 15px;
            text-shadow: 2px 2px white;
        }
    </style>
</head>
<body>

    <a href="#" class="home-icon" onclick="resetAll()">🏠</a>

    <div class="main-card" id="proposal-page">
        <h1>Will you be my val, Novia? 🌸</h1>
        <div class="photo-gallery">
            <img src="photo1.jpg"> 
            <img src="photo2.jpg"> 
            <img src="photo3.jpg">
        </div>
        <div class="button-area" id="box">
            <button id="yes-btn" onclick="showVideo()">Yes!</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="video-overlay" class="overlay">
        <h1 style="color: #ff1493; font-size: 1.5rem;">Wow!! She said Yes!! ❤️</h1>
        <video id="mainVideo" src="myvideo.mp4" playsinline controls></video>
        <div class="overlay-controls">
            <button class="surprise-btn" id="next-btn" onclick="showLetter()">Next Surprise! 😊 →</button>
        </div>
    </div>

    <div id="letter-page" class="overlay">
        <div class="letter-container">
            <div id="skip-btn" onclick="skipTyping()">Skip >></div>
            <div id="speed-toggle" onclick="toggleSpeed()">Speed: 1x</div>
            <div id="letter-content"></div>
            <button id="final-love-btn" class="surprise-btn" onclick="showFinalPhoto()">Love Forever →</button>
        </div>
    </div>

    <div id="final-photo-page" onclick="ensurePlay()">
        <div class="video-wrapper">
            <video id="lastVideo" class="final-media" loop playsinline>
                <source src="couple-video.MP4" type="video/mp4">
