<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Novia</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            background-image: url('my_background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
            padding: 20px;
        }

        .home-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 20000;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px;
            border-radius: 50%;
            line-height: 1;
            transition: transform 0.3s ease;
            text-decoration: none;
        }
        .home-icon:hover { transform: scale(1.2); }

        .main-card {
            background: rgba(255, 240, 245, 0.95); 
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            border: 2px solid #ffb6c1;
            width: 100%;
            max-width: 450px;
            position: relative;
            margin: auto;
        }

        h1 { color: #ff1493; font-size: 1.8rem; margin-top: 0; }

        .photo-gallery {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 15px 0;
            width: 100%;
        }

        .photo-gallery img {
            width: 31%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #ff69b4;
        }

        .button-area {
            margin-top: 10px;
            height: 140px; 
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button, .surprise-btn {
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #yes-btn { background: #ff69b4; color: white; transform: translateX(-65px); z-index: 5; }
        #no-btn {
            background-color: #ffffff;
            color: #ff1493;
            border: 2px solid #ffb6c1;
            position: absolute;
            left: calc(50% + 5px);
            z-index: 10;
        }

        #dey-play-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 20, 147, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
        }

        .show-toast {
            transform: translate(-50%, -50%) scale(1.2) !important;
            opacity: 1 !important;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(255, 228, 225, 0.95);
        }

        video { width: 100%; max-width: 400px; border-radius: 20px; margin-bottom: 20px; }
        .overlay-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        #whine-btn { background: white; color: #ff1493; border: 1px solid #ff1493; }
        #next-btn { background: #ff69b4; color: white; }

        .letter-container {
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            background: #fffafa;
            padding: 60px 25px 30px; 
            border-radius: 20px;
            border: 1px solid #ffb6c1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-y: auto;
            margin: auto;
        }

        #speed-toggle, #skip-btn {
            position: absolute;
            top: 15px;
            font-size: 0.75rem;
            color: #ff1493;
            background: rgba(255, 182, 193, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid #ffb6c1;
            font-weight: bold;
            z-index: 1000;
        }
        #speed-toggle { right: 15px; }
        #skip-btn { left: 15px; display: none; }

        #letter-content {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: #333;
            line-height: 1.6;
            text-align: left;
            white-space: pre-wrap;
            width: 100%;
        }

        #final-love-btn {
            opacity: 0;
            display: none;
            margin-top: 25px;
            background: #ff1493;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
            flex-shrink: 0;
        }

        .fade-in-final {
            display: block !important;
            animation: finalFade 1.2s ease forwards;
        }

        @keyframes finalFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FULL SCREEN MOBILE SLIDESHOW */
        #final-photo-page {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10000;
            background: black;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .final-media-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out; /* Smooth 1s fade */
        }

        .final-media-img.active {
            opacity: 1;
        }

        .final-text {
            position: relative;
            z-index: 10001;
            font-family: 'Dancing Script', cursive;
            color: white;
            font-size: 3.5rem;
            text-shadow: 2px 2px 15px rgba(0, 0, 0, 1), 0 0 25px rgba(255, 20, 147, 0.8);
            margin: 0;
            padding: 20px;
            pointer-events: none;
        }

        /* Desktop Adjustment */
        @media (min-width: 1024px) {
            .image-container {
                width: 100%;
                height: 100%;
            }
            .final-media-img {
                object-fit: contain; /* Keeps photos from cropping on wide screens */
                background: #000;
            }
        }
    </style>
</head>
<body>

    <a href="#" class="home-icon" onclick="resetAll()">🏠</a>

    <div class="main-card" id="proposal-page">
        <h1>Will you be my val, Novia? 🌸</h1>
        <div id="dey-play-toast">Dey Play! 😂</div>
        <div class="photo-gallery">
            <img src="photo1.jpg"> 
            <img src="photo2.jpg"> 
            <img src="photo3.jpg">
        </div>
        <div style="font-size: 24px; margin: 10px;">🍰 🎂 🧁</div>
        <div class="button-area" id="box">
            <button id="yes-btn" onclick="showVideo()">Yes!</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="video-overlay" class="overlay">
        <h1 style="color: #ff1493; font-size: 1.5rem;">Wow!! She said Yes!! Again!! ❤️</h1>
        <video id="mainVideo" src="myvideo.mp4" playsinline controls></video>
        <div class="overlay-controls">
            <button class="surprise-btn" id="whine-btn" onclick="goBack()">← You dey whine?</button>
            <button class="surprise-btn" id="next-btn" onclick="showLetter()">Next Surprise! 😊 →</button>
        </div>
    </div>

    <div id="letter-page" class="overlay">
        <div class="letter-container" id="scroll-box">
            <div id="skip-btn" onclick="skipTyping()">Skip >></div>
            <div id="speed-toggle" onclick="toggleSpeed()">Speed: 1x</div>
            <div id="letter-content"></div>
            <button id="final-love-btn" class="surprise-btn" onclick="showFinalPhoto()">Love Forever? Yes!</button>
        </div>
    </div>

    <div id="final-photo-page">
        <div class="image-container" id="slideshow">
            <img src="final_photo1.jpg" class="final-media-img active">
            <img src="final_photo2.jpg" class="final-media-img">
            <img src="final_photo3.jpg" class="final-media-img">
            <img src="final_photo4.jpg" class="final-media-img">
            <img src="final_photo5.jpg" class="final-media-img">
            <audio id="lastAudio" src="myaudio.mp3" loop></audio>
        </div>
        <div class="final-text">Forever Yours. ❤️</div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const box = document.getElementById('box');
        const toast = document.getElementById('dey-play-toast');
        const scrollBox = document.getElementById('scroll-box');
        let typingSpeedMultiplier = 1;
        let i = 0;
        let isTyping = false;
        let typingTimer;
        let returnTimeout; 

        function resetAll() { location.reload(); }

        function moveBtn() {
            toast.classList.add('show-toast');
            setTimeout(() => toast.classList.remove('show-toast'), 800);
            clearTimeout(returnTimeout); 
            const maxX = box.clientWidth - noBtn.offsetWidth - 10;
            const maxY = box.clientHeight - noBtn.offsetHeight - 10;
            noBtn.style.left = Math.max(5, Math.random() * maxX) + 'px';
            noBtn.style.top = Math.max(5, Math.random() * maxY) + 'px';
            noBtn.style.transform = "none";
            returnTimeout = setTimeout(returnHome, 2000); 
        }

        function returnHome() {
            noBtn.style.left = "calc(50% + 5px)";
            noBtn.style.top = "50%";
            noBtn.style.transform = "translateY(-50%)";
        }

        noBtn.addEventListener('mouseover', moveBtn);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveBtn(); });

        function showVideo() {
            document.getElementById('video-overlay').style.display = 'flex';
            document.getElementById('mainVideo').play();
        }

        function goBack() {
            document.getElementById('video-overlay').style.display = 'none';
            document.getElementById('mainVideo').pause();
        }

        const letterText = `Dear Novia,

Cheers to our 8th valentines together and the first as my fiance, I chose to be more creative these past few months to show you just how special you are.

Over these 8 years, I have called you different names, Ebube, Querida, Bambina, Tesoro Mio, Vauva and now Novia but through all of these it was all the same. 

The Love I have for you remains the same today as it has always been.

Right now, I just want to show you more and more of how endless my love for you is and to show you that I set the bar and it definitely would keep going higher!

To many more valentines days in Love.

Your Fiance, 
Novio`;

        function showLetter() {
            document.getElementById('video-overlay').style.display = 'none';
            document.getElementById('letter-page').style.display = 'flex';
            if (!isTyping) {
                isTyping = true;
                typeWriter();
            }
        }

        function typeWriter() {
            if (i < letterText.length) {
                let char = letterText.charAt(i);
                document.getElementById("letter-content").innerHTML += char;
                i++;
                scrollBox.scrollTop = scrollBox.scrollHeight;
                if (i > letterText.length * 0.20) document.getElementById('skip-btn').style.display = 'block';
                let delay = 85 / typingSpeedMultiplier; 
                if (char === '.' || char === ',' || char === '!') delay = 450 / typingSpeedMultiplier; 
                typingTimer = setTimeout(typeWriter, delay);
            } else {
                finishTyping();
            }
        }

        function skipTyping() {
            clearTimeout(typingTimer);
            document.getElementById("letter-content").innerHTML = letterText;
            finishTyping();
            scrollBox.scrollTop = scrollBox.scrollHeight;
        }

        function finishTyping() {
            document.getElementById('final-love-btn').classList.add('fade-in-final');
            document.getElementById('speed-toggle').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'none';
        }

        function toggleSpeed() {
            typingSpeedMultiplier = (typingSpeedMultiplier >= 5) ? 1 : typingSpeedMultiplier + 1;
            document.getElementById('speed-toggle').innerHTML = "Speed: " + typingSpeedMultiplier + "x";
        }

        let currentSlide = 0;
        const slides = document.getElementsByClassName('final-media-img');

        function startSlideshow() {
            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 3000); // Shuffling every 3 seconds
        }

        function showFinalPhoto() {
            document.getElementById('letter-page').style.display = 'none';
            document.getElementById('final-photo-page').style.display = 'flex';
            const audio = document.getElementById('lastAudio');
            audio.play().catch(e => console.log("Autoplay handled"));
            startSlideshow();
        }
    </script>
</body>
</html>
