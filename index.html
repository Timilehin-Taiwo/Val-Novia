<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Novia</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            background-image: url('my_background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
            padding: 20px;
        }

        .home-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 20000;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px;
            border-radius: 50%;
            line-height: 1;
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        /* LETTER PAGE STYLING */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(255, 228, 225, 0.95);
            overflow-y: auto;
        }

        .letter-container {
            width: 100%;
            max-width: 500px;
            background: #fffafa;
            padding: 50px 25px 30px; 
            border-radius: 20px;
            border: 1px solid #ffb6c1;
            position: relative;
        }

        #speed-toggle, #skip-btn {
            position: absolute;
            top: 12px;
            font-size: 0.75rem;
            color: #ff1493;
            background: rgba(255, 182, 193, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid #ffb6c1;
            font-weight: bold;
        }
        #speed-toggle { right: 12px; }
        #skip-btn { left: 12px; display: none; }

        #letter-content {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            color: #333;
            line-height: 1.5;
            text-align: left;
            white-space: pre-wrap;
        }

        /* FINAL PAGE - DYNAMIC FULLSCREEN VIDEO */
        #final-photo-page {
            display: none;
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            z-index: 10000;
            background: black;
            overflow: hidden;
        }

        .final-media {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; /* This makes it fill the screen on mobile & laptop */
        }

        .final-overlay-content {
            position: absolute;
            bottom: 40px;
            left: 0; width: 100%;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Allows clicks to pass to video if needed */
        }

        .final-text {
            font-family: 'Dancing Script', cursive;
            color: white;
            font-size: 2.5rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            pointer-events: auto; /* Makes buttons clickable again */
        }

        .surprise-btn {
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: #ff1493;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .surprise-btn:active { transform: scale(0.95); }

        #replay-btn {
            background: white;
            color: #ff1493;
        }

        #final-love-btn {
            opacity: 0;
            display: none;
            margin-top: 25px;
        }

        .fade-in-final {
            display: block !important;
            animation: finalFade 1.2s ease forwards;
        }

        @keyframes finalFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <a href="#" class="home-icon" onclick="resetAll()">🏠</a>

    <div class="main-card" id="proposal-page">
        <h1 style="color: #ff1493;">Will you be my val, Novia? 🌸</h1>
        <div class="button-area">
            <button id="yes-btn" onclick="showVideo()" style="background: #ff69b4; color: white;">Yes!</button>
        </div>
    </div>

    <div id="letter-page" class="overlay">
        <div class="letter-container">
            <div id="skip-btn" onclick="skipTyping()">Skip >></div>
            <div id="speed-toggle" onclick="toggleSpeed()">Speed: 1x</div>
            <div id="letter-content"></div>
            <button id="final-love-btn" class="surprise-btn" onclick="showFinalPhoto()">Love Forever →</button>
        </div>
    </div>

    <div id="final-photo-page">
        <video id="lastVideo" class="final-media" loop playsinline>
            <source src="couple-video.MP4" type="video/mp4">
        </video>
        
        <div class="final-overlay-content">
            <div class="final-text">Forever Yours. ❤️</div>
            <div class="button-group">
                <button id="replay-btn" class="surprise-btn" onclick="replayVideo()">Replay ↺</button>
                <button class="surprise-btn" onclick="resetAll()">Home 🏠</button>
            </div>
        </div>
    </div>

    <script>
        let typingSpeedMultiplier = 1;
        let i = 0;
        let isTyping = false;
        let typingTimer;

        const letterText = `Dear Novia,

Cheers to our 8th valentines together and the first as my fiance, I chose to be more creative these past few months to show you just how special you are.

Over these 8 years, I have called you different names, Ebube, Querida, Bambina, Tesoro Mio, Vauva and now Novia but through all of these it was all the same. 

The Love I have for you remains the same today as it has always been.

Right now, I just want to show you more and more of how endless my love for you is and to show you that I set the bar and it definitely would keep going higher!

To many more valentines days in Love.

Your Fiance, 
Novio`;

        function resetAll() { location.reload(); }

        function showVideo() {
            // Skips the mid-video if you prefer and goes straight to letter
            showLetter();
        }

        function showLetter() {
            document.getElementById('proposal-page').style.display = 'none';
            document.getElementById('letter-page').style.display = 'flex';
            if (!isTyping) {
                isTyping = true;
                typeWriter();
            }
        }

        function typeWriter() {
            if (i < letterText.length) {
                let char = letterText.charAt(i);
                document.getElementById("letter-content").innerHTML += char;
                i++;
                if (i > letterText.length * 0.85) document.getElementById('skip-btn').style.display = 'block';
                let delay = 85 / typingSpeedMultiplier; 
                if (char === '.' || char === ',' || char === '!') delay = 450 / typingSpeedMultiplier; 
                typingTimer = setTimeout(typeWriter, delay);
            } else {
                finishTyping();
            }
        }

        function skipTyping() {
            clearTimeout(typingTimer);
            document.getElementById("letter-content").innerHTML = letterText;
            finishTyping();
        }

        function finishTyping() {
            document.getElementById('final-love-btn').classList.add('fade-in-final');
            document.getElementById('speed-toggle').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'none';
        }

        function toggleSpeed() {
            typingSpeedMultiplier = (typingSpeedMultiplier >= 5) ? 1 : typingSpeedMultiplier + 1;
            document.getElementById('speed-toggle').innerHTML = "Speed: " + typingSpeedMultiplier + "x";
        }

        function showFinalPhoto() {
            document.getElementById('letter-page').style.display = 'none';
            const finalPage = document.getElementById('final-photo-page');
            const video = document.getElementById('lastVideo');
            finalPage.style.display = 'block';
            video.currentTime = 0;
            video.play();
        }

        function replayVideo() {
            const video = document.getElementById('lastVideo');
            video.currentTime = 0;
            video.play();
        }
    </script>
</body>
</html>
