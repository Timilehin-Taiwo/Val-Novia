
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Val?</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(to bottom right, #ffc0cb, #ff69b4);
    overflow: hidden;
    text-align: center;
}

h1 {
    margin-top: 100px;
    font-size: 3em;
    color: white;
    text-shadow: 2px 2px 5px #ff1493;
}

.buttons {
    margin-top: 50px;
    position: relative;
    height: 200px;
}

button {
    padding: 15px 40px;
    font-size: 1.5em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    position: absolute;
}

#yesBtn {
    left: 40%;
    background-color: #ff1493;
    color: white;
}

#noBtn {
    left: 60%;
    background-color: white;
    color: #ff1493;
}

.decor {
    position: absolute;
    font-size: 40px;
    animation: float 5s infinite ease-in-out;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
}

#videoContainer {
    display: none;
    margin-top: 50px;
}

video {
    width: 70%;
    border-radius: 20px;
    box-shadow: 0 0 30px pink;
}
</style>
</head>

<body>

<h1>Will you be my val Novia? 💖</h1>

<div class="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😢</button>
</div>

<div id="videoContainer">
    <video controls>
        <source src="yourvideo.mp4" type="video/mp4">
    </video>
</div>

<div class="decor" style="top:10%; left:10%;">🌸</div>
<div class="decor" style="top:20%; right:15%;">🎂</div>
<div class="decor" style="bottom:15%; left:20%;">🌷</div>
<div class="decor" style="bottom:10%; right:20%;">💐</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const videoContainer = document.getElementById("videoContainer");

noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", function() {
    document.querySelector(".buttons").style.display = "none";
    videoContainer.style.display = "block";
});
</script>

</body>
</html>
