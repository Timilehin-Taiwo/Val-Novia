
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Val?</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(to bottom right, #ffc0cb, #ff69b4);
    overflow: hidden;
    text-align: center;
}

h1 {
    margin-top: 60px;
    font-size: 3em;
    color: white;
    text-shadow: 2px 2px 10px #ff1493;
}

.gallery {
    margin-top: 20px;
}

.gallery img {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 20px;
    margin: 10px;
    box-shadow: 0 0 20px white;
    border: 4px solid white;
}

.buttons {
    margin-top: 40px;
    position: relative;
    height: 300px;
}

button {
    padding: 15px 40px;
    font-size: 1.5em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    position: absolute;
    transition: 0.2s;
}

#yesBtn {
    left: 40%;
    top: 150px;
    background-color: #ff1493;
    color: white;
}

#yesBtn:hover {
    background-color: #ff69b4;
}

#noBtn {
    left: 60%;
    top: 150px;
    background-color: white;
    color: #ff1493;
}

.decor {
    position: absolute;
    font-size: 40px;
    animation: float 5s infinite ease-in-out;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
}

#videoContainer {
    display: none;
    margin-top: 30px;
}

video {
    width: 70%;
    border-radius: 20px;
    box-shadow: 0 0 30px pink;
}
</style>
</head>

<body>

<h1>Will you be my val, Novia. 💖</h1>

<div class="gallery">
    <img src="pic1.jpg">
    <img src="pic2.jpg">
    <img src="pic3.jpg">
</div>

<div class="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😢</button>
</div>

<div id="videoContainer">
    <video controls>
        <source src="yourvideo.mp4" type="video/mp4">
    </video>
</div>

<div class="decor" style="top:10%; left:10%;">🌸</div>
<div class="decor" style="top:20%; right:15%;">🎂</div>
<div class="decor" style="bottom:15%; left:20%;">🌷</div>
<div class="decor" style="bottom:10%; right:20%;">💐</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const videoContainer = document.getElementById("videoContainer");

document.addEventListener("mousemove", function(e) {

    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if (distance < 120) {
        const newX = Math.random() * (window.innerWidth - rect.width);
        const newY = Math.random() * (window.innerHeight - rect.height);
        noBtn.style.left = newX + "px";
        noBtn.style.top = newY + "px";
    }
});

yesBtn.addEventListener("click", function() {
    document.querySelector(".buttons").style.display = "none";
    videoContainer.style.display = "block";
});
</script>

</body>
</html>
