<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Novia</title>
    <style>
        body {
            background-color: #fff0f5;
            background-image: url('https://www.transparenttextures.com/patterns/floral-paper.png');
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.4);
            border: 3px solid #ffb6c1;
            max-width: 600px;
            position: relative;
        }

        h1 { color: #ff1493; font-size: 2.5rem; }

        .photo-gallery {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .photo-gallery img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid #ff69b4;
        }

        .button-container {
            margin-top: 30px;
            height: 100px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #yes-btn {
            background: #ff69b4;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.3);
        }

        #no-btn {
            background-color: #ffffff;
            color: #ff69b4;
            border: 2px solid #ff69b4;
            position: absolute;
            z-index: 1000;
            transition: 0.1s;
        }

        #video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffe4e1;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        video {
            max-width: 90%;
            max-height: 70%;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>Will you be my val, Novia? 🌸</h1>
        
        <div class="photo-gallery">
            <img src="photo1.jpg"> 
            <img src="photo2.jpg"> 
            <img src="photo3.jpg">
        </div>

        <div style="font-size: 40px; margin: 15px;">🍰 🎂 🧁</div>

        <div class="button-container">
            <button id="yes-btn" onclick="showVideo()">Yes!</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="video-overlay">
        <h1 style="color: #ff1493;">I Love You Forever! ❤️</h1>
        <video id="mainVideo" src="myvideo.mp4" controls></video>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const moveBtn = () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        };

        noBtn.addEventListener('mouseenter', moveBtn);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveBtn(); });

        function showVideo() {
            document.getElementById('video-overlay').style.display = 'flex';
            document.getElementById('mainVideo').play();
        }
    </script>
</body>
</html>
